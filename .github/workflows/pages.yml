name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Stamp last-modified date
        run: |
          d=$(git log -1 --format=%cs)
          sed -i "s#<lastmod>[^<]*</lastmod>#<lastmod>$d</lastmod>#" sitemap.xml
          sed -i "s#\"dateModified\": \"[^\"]*\"#\"dateModified\": \"$d\"#" index.html
          grep -o "<lastmod>[^<]*</lastmod>" sitemap.xml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
